# Сборка приложения для iPhone/iPad без подписи (подписывает Sideloadly при установке, см. ios/README.md).
# Результат — релиз «iPhone: сборка N» с файлом Zarplata.ipa: https://github.com/<владелец>/<репозиторий>/releases/latest
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "android/web/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Copy the web app into the iOS project
        run: |
          mkdir -p ios/Zarplata/web
          rsync -a --exclude 'dev-*' --exclude 'sw.js' --exclude '*.apk' --exclude 'update.sig' android/web/ ios/Zarplata/web/
          ls ios/Zarplata/web

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -version
          set +e
          xcodebuild -project Zarplata.xcodeproj -target Zarplata -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} SYMROOT="$PWD/build" build > build.log 2>&1
          status=$?
          set -e
          # ошибки и «nearly matches» (метод делегата не подхватился бы) выводим аннотациями — их видно на странице сборки
          grep -E "error:|nearly matches" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -n 60 build.log
          if [ $status -ne 0 ] || grep -q "nearly matches" build.log; then exit 1; fi

      - name: Package the IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/Zarplata.app Payload/
          zip -qry Zarplata.ipa Payload
          ls -la Zarplata.ipa

      # Самопроверка на симуляторе: запуск с демо-данными и автообновление с настоящего сайта (версия приложения занижена, поэтому обновление найдётся),
      # повторный запуск уже из папки обновления, затем очистка данных WebKit (данные должны восстановиться из копии приложения)
      # и резервная копия (файл в Documents + окно «Поделиться»). Итоги — аннотациями, снимки — в ветку ci-shots.
      - name: Smoke test in the iOS simulator
        continue-on-error: true
        run: |
          cd ios
          sed -i '' -E 's/"version": [0-9]+/"version": 0/' Zarplata/web/update.json
          xcodebuild -project Zarplata.xcodeproj -target Zarplata -configuration Debug -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO SYMROOT="$PWD/build-sim" build > sim-build.log 2>&1 \
            || { tail -n 40 sim-build.log; echo "::error::simulator build failed"; exit 1; }
          APP="$PWD/build-sim/Debug-iphonesimulator/Zarplata.app"
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "::notice::simulator: $(xcrun simctl list devices | grep "$UDID" | xargs)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" uz.zarplata.app -smoke-demo
          sleep 25
          xcrun simctl io "$UDID" screenshot sim-1-demo.png
          DATA=$(xcrun simctl get_app_container "$UDID" uz.zarplata.app data)
          xcrun simctl terminate "$UDID" uz.zarplata.app
          sleep 2
          echo "::notice::copy of data after demo: $(ls -l "$DATA/Library/Application Support" | tail -n +2 | xargs)"
          echo "::notice::downloaded update: $(ls "$DATA/Library/Application Support/web" 2>/dev/null | xargs) files: $(ls "$DATA/Library/Application Support/web/"* 2>/dev/null | wc -l)"
          xcrun simctl launch "$UDID" uz.zarplata.app -smoke-info
          sleep 12
          xcrun simctl terminate "$UDID" uz.zarplata.app
          sleep 2
          echo "::notice::after the update: $(cat "$DATA/Documents/smoke-info.txt" 2>/dev/null)"
          rm -rf "$DATA/Library/WebKit" "$DATA/Library/Caches"
          xcrun simctl launch "$UDID" uz.zarplata.app -smoke-backup
          sleep 15
          xcrun simctl io "$UDID" screenshot sim-2-restored-backup.png
          echo "::notice::Documents after backup: $(ls -l "$DATA/Documents" | tail -n +2 | xargs)"
          echo "::notice::request from the app to Firebase: $(cat "$DATA/Documents/smoke-fetch.txt" 2>/dev/null)"

      - name: Publish simulator screenshots to the ci-shots branch
        if: always()
        continue-on-error: true
        run: |
          ls ios/sim-*.png || exit 0
          mkdir -p /tmp/shots && cp ios/sim-*.png /tmp/shots/ && cd /tmp/shots
          git init -q && git checkout -q -b ci-shots && git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Simulator screenshots, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: "iPhone: сборка ${{ github.run_number }}"
          make_latest: true
          files: ios/Zarplata.ipa
          body: |
            Приложение «Зарплата» для iPhone и iPad (iOS 15 и новее), без подписи.
            Устанавливается с компьютера через Sideloadly с вашим Apple ID — инструкция в ios/README.md.
