<!doctype html><meta charset="utf-8"><title>calc tests</title>
<pre id="o">running…</pre>
<script src="calc.js"></script>
<script>
const { calc, DEFAULT_RULES } = window.Calc;
const out = []; let fails = 0;
function eq(a, b, m) { const ok = JSON.stringify(a) === JSON.stringify(b); if (!ok) { fails++; out.push("FAIL " + m + " got " + JSON.stringify(a) + " want " + JSON.stringify(b)); } }
const R = DEFAULT_RULES;
eq(calc({ amount: 5000000, mode: "gross", type: "trud" }, R), { gross: 5000000, exempt: 0, pit: 600000, inps: 5000, pitBudget: 595000, esp: 600000, net: 4400000, cost: 5600000 }, "inside");
const o = calc({ amount: 5000000, mode: "gross", type: "trud" }, { ...R, inpsInsidePit: false });
eq([o.net, o.pitBudget], [4395000, 600000], "outside");
const g = calc({ amount: 1000000, mode: "gross", type: "gph" }, { ...R, inpsGph: false });
eq([g.inps, g.pitBudget, g.net], [0, 120000, 880000], "gph без ИНПС");
const g2 = calc({ amount: 1000000, mode: "gross", type: "gph" }, R);
eq([g2.inps, g2.pitBudget, g2.net], [1000, 119000, 880000], "gph с ИНПС (по умолчанию)");
let cnt = 0;
for (const inside of [true, false]) for (const type of ["trud", "gph"]) for (const benefit of [0, 1.41, 3]) for (let net = 0; net < 20000000; net += 12345) {
  const Rr = { ...R, inpsInsidePit: inside, inpsGph: !inside }, p = { amount: net, mode: "net", type, benefit }, r = calc(p, Rr); cnt++;
  if (r.net !== net) { eq(r.net, net, "net " + net + inside + type + benefit); break; }
  if (r.gross > 0 && calc({ amount: r.gross - 1, mode: "gross", type, benefit }, Rr).net >= net) { eq(0, 1, "minimal gross " + net + type + benefit); break; }
}
eq(calc({ amount: 1000000, mode: "gross", type: "trud" }, { ...R, budget: true }).esp, 250000, "budget");
const IT = { ...R, itpark: true };
eq(calc({ amount: 10000000, mode: "gross", type: "trud" }, IT), { gross: 10000000, exempt: 0, pit: 750000, inps: 10000, pitBudget: 740000, esp: 0, net: 9250000, cost: 10000000 }, "itpark trud");
eq(calc({ amount: 1000000, mode: "gross", type: "gph" }, IT), calc({ amount: 1000000, mode: "gross", type: "gph" }, R), "itpark gph = обычные ставки");
for (let net = 0; net < 20000000; net += 54321) { const r = calc({ amount: net, mode: "net", type: "trud" }, IT); if (r.net !== net) { eq(r.net, net, "itpark reverse " + net); break; } }
// льгота ст. 380: 1,41 МРОТ = 1 917 600 не облагается
const b = calc({ amount: 5000000, mode: "gross", type: "trud", benefit: 1.41 }, R);
eq([b.exempt, b.pit, b.inps, b.pitBudget, b.net, b.esp], [1917600, 369888, 3082, 366806, 4630112, 600000], "ст.380 1,41");
const b2 = calc({ amount: 1500000, mode: "gross", type: "trud", benefit: 1.41 }, R);
eq([b2.exempt, b2.pit, b2.net], [1500000, 0, 1500000], "ст.380: доход меньше лимита");
const b3 = calc({ amount: 5000000, mode: "gross", type: "gph", benefit: 3 }, R);
eq(b3.exempt, 0, "ст.380 не для ГПХ");
eq(calc({ amount: "abc", mode: "net", type: "trud" }).gross, 0, "garbage");
eq(calc({ amount: -5, mode: "gross", type: "trud" }).net, 0, "negative");
document.getElementById("o").textContent = (fails ? out.join("\n") : "ALL OK (" + cnt + " reverse cases)");
document.title = fails ? "FAIL" : "PASS";
</script>
