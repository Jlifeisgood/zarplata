<div id="app"></div>
<script>
// если что-то пошло не так — показать причину вместо пустого экрана
window.addEventListener("error", function (e) {
  var a = document.getElementById("app");
  if (a && !a.firstChild) a.innerHTML = '<div style="padding:24px;font:14px/1.4 system-ui;color:#b00020"><b>Ошибка приложения</b><br>' + String(e.message).replace(/</g, "&lt;") + '<br><small>' + String(e.filename).split("/").pop() + ":" + e.lineno + "</small></div>";
});
</script>
